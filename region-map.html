<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Map of #BEmesh region codes (eu, be, be-* and the neighbouring countries) — country, province and gewest boundaries and municipality location points"
      data-i18n-attr="content:regionMap.description"
    />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./lib/css/leaflet.css" />
    <link rel="stylesheet" href="./lib/css/MarkerCluster.css" />
    <link rel="stylesheet" href="./lib/css/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="./src/shared/bemesh-tokens.css" />
    <link rel="stylesheet" href="./src/shared/bemesh-shell.css" />
    <link rel="stylesheet" href="./css/region-map.css" />
    <script src="./src/shared/i18n.js" data-i18n="region-map"></script>
    <script src="./src/shared/theme.js"></script>
    <title data-i18n="regionMap.title">Region codes map – #BEmesh</title>
  </head>
  <body class="region-map-body">
    <script>
      (function () {
        var q = new URLSearchParams(window.location.search || "");
        var ev = (q.get("embed") || "").toLowerCase();
        var embedParam = ev === "1" || ev === "true" || (q.has("embed") && ev === "");
        var inFrame = false;
        try {
          inFrame = window.self !== window.top;
        } catch (e) {
          inFrame = true;
        }
        if (embedParam || inFrame) {
          document.documentElement.classList.add("region-map-embed");
        }
      })();
    </script>
    <header class="topbar">
      <span class="wordmark"><b>#BE</b><span data-i18n="regionMap.wordmark">mesh region map</span></span>
      <nav class="switcher" aria-label="Pages" data-i18n-attr="aria-label:top.pages">
        <a href="/" data-i18n="page.map">Map</a><a href="/stats" data-i18n="page.stats">Stats</a
        ><a href="/region-map" aria-current="page" data-i18n="page.regionMap">Region map</a
        ><a href="/configurator" data-i18n="page.configurator">Configurator</a>
      </nav>
      <span class="spacer"></span>
      <span data-account-chip></span>
      <span data-lang-switch></span>
      <span class="menu-wrap" data-page-menu>
        <button type="button" class="icon" aria-label="Menu" data-i18n-attr="aria-label:menu.label">☰</button>
        <nav class="menu" aria-label="Menu" data-i18n-attr="aria-label:menu.label" hidden></nav>
      </span>
      <button type="button" class="icon" data-theme-toggle aria-label="Theme">
        ◐
      </button>
    </header>
    <div class="region-map-layout">
      <aside class="region-map-controls" id="controls">
        <div class="region-map-controls-inner">
          <div class="region-map-search-wrap">
            <input
              id="code-input"
              type="text"
              class="input"
              placeholder="Search city, province or region"
              aria-label="Search city, province or region"
              data-i18n-attr="placeholder:regionMap.search; aria-label:regionMap.search"
              spellcheck="false"
              autocomplete="off"
            />
            <div id="autocomplete"></div>
          </div>
          <div id="counter" class="muted">
            <span id="counter-text"></span>
          </div>
          <div class="field-label" id="borders-label" data-i18n="regionMap.borders">Borders</div>
          <div
            class="segmented"
            id="overlay-seg"
            role="group"
            aria-labelledby="borders-label"
          >
            <button type="button" data-value="" aria-pressed="false" data-i18n="regionMap.borders.off">Off</button>
            <button type="button" data-value="provinces" aria-pressed="true" data-i18n="regionMap.borders.provinces">
              Provinces
            </button>
            <button type="button" data-value="gewesten" aria-pressed="false" data-i18n="regionMap.borders.gewesten">
              Gewesten
            </button>
            <button type="button" data-value="countries" aria-pressed="false" data-i18n="regionMap.borders.countries">
              Countries
            </button>
          </div>
          <label class="region-map-places-check">
            <input type="checkbox" id="show-places" checked /> <span data-i18n="regionMap.places">Location points</span>
          </label>
          <div class="field-label" data-i18n="regionMap.codes">Region codes</div>
          <div class="hierarchy-tree" id="hierarchy"></div>
        </div>
      </aside>
      <button
        type="button"
        class="region-map-controls-toggle"
        id="toggle-controls"
        title="Toggle side panel"
        aria-label="Toggle side panel"
        data-i18n-attr="title:regionMap.togglePanel; aria-label:regionMap.togglePanel"
        aria-expanded="true"
      >
        <span aria-hidden="true">‹</span>
      </button>
      <div class="region-map-main">
        <div id="region-map-container"></div>
      </div>
    </div>

    <script src="./lib/leaflet.js"></script>
    <script src="./lib/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="./src/shared/be-regions.js"></script>
    <script src="./src/shared/topbar.js"></script>
    <script src="./src/shared/map-shade.js"></script>
    <script src="./src/region-map.js"></script>
  </body>
</html>
