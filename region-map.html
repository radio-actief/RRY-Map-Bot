<!doctype html>
<html lang="en" class="region-map-page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Map of Belgian MeshCore regions (be, be-*) — province boundaries and municipality location points"
    />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./lib/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./lib/css/bootstrap-icons.css" />
    <link rel="stylesheet" href="./css/bootstrap-rry-theme.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/rry-tool-pages.css" />
    <link rel="stylesheet" href="./css/region-map-page.css" />
    <link rel="stylesheet" href="./lib/css/leaflet.css" />
    <link rel="stylesheet" href="./lib/css/MarkerCluster.css" />
    <link rel="stylesheet" href="./lib/css/MarkerCluster.Default.css" />
    <title>Region codes map – #BEmesh</title>
  </head>
  <body class="light map-page region-map-body rty-map-view">
    <script>
      (function () {
        var q = new URLSearchParams(window.location.search || "");
        var ev = (q.get("embed") || "").toLowerCase();
        var embedParam = ev === "1" || ev === "true" || (q.has("embed") && ev === "");
        var inFrame = false;
        try {
          inFrame = window.self !== window.top;
        } catch (e) {
          inFrame = true;
        }
        if (embedParam || inFrame) {
          document.documentElement.classList.add("region-map-embed");
        }
      })();
    </script>
    <div class="region-map-layout">
      <div class="region-map-controls" id="controls">
        <div class="region-map-controls-inner">
          <div class="region-map-controls-top">
            <h3>Search region codes</h3>
            <div class="region-map-search-wrap">
              <input
                id="code-input"
                type="text"
                class="form-control"
                placeholder="e.g. be-vwv, Belgium, or a place name…"
                aria-label="Search region codes"
                spellcheck="false"
                autocomplete="off"
              />
              <div id="autocomplete"></div>
            </div>
            <div id="counter">
              <span id="counter-text"
                >Enter a province code (be-*), be, or a place name</span
              >
              <div class="spinner" id="spinner" style="display: none"></div>
            </div>
          </div>
          <div class="region-map-controls-scroll">
            <div class="region-map-overlays">
              <div class="region-map-overlays-title">Province boundaries</div>
              <div class="region-map-overlays-radios">
                <label>
                  <input type="radio" name="overlay" value="" /> Off
                </label>
                <label>
                  <input
                    type="radio"
                    name="overlay"
                    value="provinces"
                    checked
                  />
                  Provinces
                </label>
              </div>
            </div>
            <div class="region-map-places-check">
              <label>
                <input type="checkbox" id="show-places" checked /> Show location
                points
              </label>
            </div>
            <div class="region-map-hierarchy">
              <h4>Region codes</h4>
              <div class="hierarchy-tree" id="hierarchy"></div>
            </div>
          </div>
        </div>
      </div>
      <button
        type="button"
        class="region-map-controls-toggle"
        id="toggle-controls"
        title="Toggle side panel"
        aria-expanded="true"
      >
        <span class="region-map-controls-chevron" aria-hidden="true"></span>
      </button>
      <div class="region-map-main">
        <div class="region-map-header-bar rty-glass-surface rty-chrome-accent-bar">
          <div class="region-map-header-main">
            <div class="region-map-header-brand">
              <img
                src="./favicon-32.png"
                alt=""
                class="region-map-header-logo"
                width="32"
                height="32"
                decoding="async"
                aria-hidden="true"
              />
              <div>
                <h1>Region codes map</h1>
                <p class="region-map-attrib" aria-hidden="false">
                  #BEmesh region map
                </p>
              </div>
            </div>
          </div>
          <nav class="region-map-header-links" aria-label="Page navigation">
            <a href="/" class="rty-back-link">← Back to map</a>
            <a href="/configurator" class="rty-back-link">Configurator</a>
            <a
              href="/stats"
              class="region-map-header-icon-btn"
              title="Open statistics"
              aria-label="Open statistics"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 15h2v-4H7v4zm4 0h2v-8h-2v8zm4 0h2v-5h-2v5z"
                />
              </svg>
            </a>
          </nav>
        </div>
        <div id="region-map-container"></div>
      </div>
    </div>

    <script src="./lib/js/bootstrap.bundle.min.js"></script>
    <script src="./lib/leaflet.js"></script>
    <script src="./lib/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="./src/shared/be-regions.js"></script>
    <script src="./src/region-map.js"></script>
  </body>
</html>
