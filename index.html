<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="./src/shared/theme.js"></script>
    <link rel="stylesheet" href="./lib/css/bootstrap-icons.css" />
    <link rel="stylesheet" href="./lib/css/leaflet.css" />
    <link rel="stylesheet" href="./lib/css/MarkerCluster.css" />
    <link rel="stylesheet" href="./lib/css/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="./src/shared/bemesh-tokens.css" />
    <link rel="stylesheet" href="./src/shared/bemesh-shell.css" />
    <link rel="stylesheet" href="./css/map.css" />
    <script src="./lib/leaflet.js" defer></script>
    <script src="./lib/leaflet.markercluster.js" defer></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>#BEmesh Map</title>
  </head>
  <body class="map-page">
    <div id="map"></div>
    <div id="app" v-cloak>
      <div class="loading" v-if="app.loading"></div>
      <header class="topbar">
        <span class="wordmark"><b>#BE</b>mesh map</span>
        <nav class="switcher" aria-label="Pages">
          <a href="/" aria-current="page">Map</a><a href="/stats">Stats</a
          ><a href="/region-map">Region map</a
          ><a href="/configurator">Configurator</a>
        </nav>
        <span class="chip counts-chip" v-if="stats.length">
          <span v-html="stats[0]"></span>
        </span>
        <span class="chip muted recent-chip" v-if="stats.length">
          <span v-for="stat in stats.slice(1)" v-html="stat"></span>
        </span>
        <span class="spacer"></span>
        <span data-account-chip></span>
        <span class="menu-wrap" data-page-menu>
          <button type="button" class="icon" aria-label="Menu">☰</button>
          <nav class="menu" aria-label="Menu" hidden></nav>
        </span>
        <button type="button" class="icon" data-theme-toggle aria-label="Theme">
          ◐
        </button>
      </header>

      <div class="map-overlay">
        <form class="search-box map-float" action="javascript:;">
          <div class="search-row">
            <input
              type="text"
              id="search-nodes-input"
              class="input"
              list="nodes"
              v-model="app.search"
              placeholder="Search nodes, name or key"
              aria-label="Search nodes, name or key"
              autocomplete="off"
              v-if="app.nodes"
            />
            <button
              type="button"
              class="btn small filter-toggle"
              :class="{ active: filtersActive }"
              :aria-expanded="app.filterMenuOpen"
              aria-haspopup="true"
              aria-controls="node-filter"
              @click.stop="app.filterMenuOpen = !app.filterMenuOpen"
            >
              {{ filtersActive ? "Filters active" : "Filters" }}
            </button>
          </div>
          <div class="search-results" v-if="searchResults?.length > 0 && !app.filterMenuOpen">
            <ul>
              <li
                v-for="node in searchResults"
                tabindex="0"
                @click="showNode(node)"
                @keyup.enter="showNode(node)"
              >
                <img :src="`./img/node_types/${node.type}.svg`" width="28" alt="" />
                <div class="search-text">
                  <div
                    class="search-name"
                    v-html="highlightString(node.adv_name, app.search)"
                  ></div>
                  <div
                    class="search-pkey"
                    v-html="highlightString(node.public_key, app.search)"
                  ></div>
                </div>
              </li>
            </ul>
          </div>
        </form>

        <div
          class="map-float filter-panel card"
          id="node-filter"
          v-show="app.filterMenuOpen"
        >
          <div class="filter-label">Type</div>
          <div class="filter-chips">
            <label class="chip toggle"
              ><input type="checkbox" value="1" v-model="app.nodeFilter" />Clients</label
            >
            <label class="chip toggle"
              ><input type="checkbox" value="2" v-model="app.nodeFilter" />Repeaters</label
            >
            <label class="chip toggle"
              ><input type="checkbox" value="3" v-model="app.nodeFilter" />Room servers</label
            >
            <label class="chip toggle"
              ><input type="checkbox" value="4" v-model="app.nodeFilter" />Sensors</label
            >
          </div>
          <div class="filter-label">Source</div>
          <div class="segmented">
            <button
              type="button"
              :aria-pressed="app.sourceFilter.length === 0 || (app.sourceFilter.includes('app') && app.sourceFilter.includes('uploader'))"
              @click="app.sourceFilter = ['app', 'uploader']"
            >
              All
            </button>
            <button
              type="button"
              :aria-pressed="app.sourceFilter.length === 1 && app.sourceFilter[0] === 'app'"
              @click="app.sourceFilter = ['app']"
            >
              App
            </button>
            <button
              type="button"
              :aria-pressed="app.sourceFilter.length === 1 && app.sourceFilter[0] === 'uploader'"
              @click="app.sourceFilter = ['uploader']"
            >
              Uploader
            </button>
          </div>
          <div class="filter-label">Discord</div>
          <div class="segmented">
            <button
              type="button"
              :aria-pressed="app.claimedFilter.length === 0 || (app.claimedFilter.includes('claimed') && app.claimedFilter.includes('unclaimed'))"
              @click="app.claimedFilter = ['claimed', 'unclaimed']"
            >
              All
            </button>
            <button
              type="button"
              :aria-pressed="app.claimedFilter.length === 1 && app.claimedFilter[0] === 'claimed'"
              @click="app.claimedFilter = ['claimed']"
            >
              Claimed
            </button>
            <button
              type="button"
              :aria-pressed="app.claimedFilter.length === 1 && app.claimedFilter[0] === 'unclaimed'"
              @click="app.claimedFilter = ['unclaimed']"
            >
              Unclaimed
            </button>
          </div>
          <details class="filter-more">
            <summary>More</summary>
            <label class="filter-field"
              ><span>Last updated</span>
              <input type="date" class="input" v-model="app.fromDate"
            /></label>
            <label class="filter-field"
              ><span>Inserted</span>
              <input type="date" class="input" v-model="app.fromInsertDate"
            /></label>
            <label class="filter-field"
              ><span>City</span>
              <input
                type="text"
                class="input"
                v-model="app.cityFilter"
                placeholder="Filter by city"
                id="city-filter-input"
            /></label>
            <div v-if="app.availableFreqs.length > 0">
              <div class="filter-label">Frequency</div>
              <div class="filter-chips">
                <label
                  class="chip toggle"
                  v-for="freq in app.availableFreqs"
                  :key="freq"
                  ><input type="checkbox" :value="freq" v-model="app.freqFilter" />{{ freq }} MHz</label
                >
              </div>
            </div>
            <label class="filter-field"
              ><span>Clustering zoom level</span>
              <input
                id="clustering-zoom-slider"
                min="8"
                max="13"
                type="range"
                v-model="app.clusteringZoom"
            /></label>
          </details>
          <button
            v-if="filtersActive"
            type="button"
            class="btn small"
            @click="clearFilters"
          >
            Clear filters
          </button>
        </div>

        <div
          class="map-float totals-chip"
          v-if="totals && !searchResults?.length && !app.filterMenuOpen"
        >
          <b>{{ totals.total }}</b> nodes · +{{ totals.week }} this week
        </div>

        <a
          class="btn primary add-node"
          title="Add node to map"
          target="_blank"
          rel="noopener noreferrer"
          href="https://github.com/meshcore-dev/MeshCore/blob/main/docs/faq.md#512-q-how-do-i-add-a-node-to-the-meshcore-map"
          ><span class="add-long">+ Add node</span
          ><span class="add-short">+ Add</span></a
        >
      </div>
    </div>
    <script src="./src/shared/topbar.js"></script>
  </body>
  <script type="module" src="./src/map.js"></script>
</html>
