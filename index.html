<!DOCTYPE html>
<html>
	<head>
		<link rel="icon" type="image/x-icon" href="./favicon.ico" />
		<link rel="stylesheet" href="./css/style.css" />
		<link rel="stylesheet" href="./lib/css/beer.css" />
		<link rel="stylesheet" href="./lib/css/leaflet.css" />
		<link rel="stylesheet" href="./lib/css/MarkerCluster.css" />
		<link rel="stylesheet" href="./lib/css/MarkerCluster.Default.css" />
		<script src="./lib/beer.min.js" type="module"></script>
		<script src="./lib/leaflet.js"></script>
		<script src="./lib/leaflet.markercluster.js"></script>
		<meta name="viewport" content="initial-scale=1.0, width=device-width" />
		<title>MeshCore Node Map</title>
	</head>
	<body class="light">

		<div class="container">
			<div id="map"></div>
			<div id="app" v-cloak>
				<div class="loading" v-if="app.loading"></div>
				<a class="manual-add square round light-blue extra" title="Add node to map" target="_blank" href="https://github.com/meshcore-dev/MeshCore/blob/main/docs/faq.md#512-q-how-do-i-add-a-node-to-the-meshcore-map"><i class="extra">add</i></a>
				<div class="stats">
					<div class="stats-rows">
						<div class="stats-row stats-row-main">
							<span class="stats-icon-wrap" title="Stats">
								<svg class="stats-icon mdi-chart-line" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path :d="mdiChartLine" fill="currentColor"/></svg>
							</span>
							<span v-for="stat in stats" v-html="stat"></span>
						</div>
						<div v-if="auth.authenticated" class="stats-row stats-row-personal">
							<span class="stats-icon-wrap" title="Personal stats">
								<svg class="stats-icon mdi-counter" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path :d="mdiCounter" fill="currentColor"/></svg>
							</span>
							<span v-for="stat in personalStats" v-html="stat" style="margin-right: 8px;"></span>
						</div>
					</div>
					<!-- Auth + GitHub: right column, spans both rows -->
					<div class="stats-auth">
						<span v-if="auth.authenticated" class="auth-display" style="display: flex; align-items: center; gap: 8px; margin-right: 8px; white-space: nowrap;">
							<span class="auth-text" style="color: #000;">
								<span class="auth-full">Logged in as <strong style="text-decoration: underline; color: #4CAF50;">@{{ auth.user.username }}</strong> via <span style="color: #5865F2;">Discord</span></span>
								<span class="auth-compact"><strong style="text-decoration: underline; color: #4CAF50;">@{{ auth.user.username }}</strong></span>
							</span>
							<a href="/auth/logout" class="logout-link" style="display: inline-flex; align-items: center; color: #f44336; text-decoration: none; flex-shrink: 0;" title="Logout"><svg class="mdi-logout" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path :d="mdiLogout" fill="currentColor"/></svg></a>
						</span>
						<a v-else href="/auth/login" style="display: flex; align-items: center; gap: 6px; color: #5865F2; text-decoration: none; margin-right: 8px;" title="Login with Discord">
							<img src="./img/discord-logo.svg" alt="Discord" style="width: 18px; height: 18px; vertical-align: middle;">
							Login with Discord
						</a>
					</div>
				</div>
				<form class="search no-margin" action="javascript:;">
					<menu class="left no-wrap" id="node-filter" data-ui="#node-filter">
							<li style="margin-top: 4px; padding-top: 4px; border-top: 1px solid #ddd;">
								<span style="font-weight: bold; font-size: 0.9em;">Type</span>
							</li>
							<li>
								<label class="checkbox">
									<input type="checkbox" value="1" v-model="app.nodeFilter"><span>Clients</span>
								</label>
							</li>
							<li>
								<label class="checkbox">
									<input type="checkbox" value="2" v-model="app.nodeFilter"><span>Repeaters</span>
								</label>
							</li>
							<li>
								<label class="checkbox">
									<input type="checkbox" value="3" v-model="app.nodeFilter"><span>Room Servers</span>
								</label>
							</li>
							<li>
								<label class="checkbox">
									<input type="checkbox" value="4" v-model="app.nodeFilter"><span>Sensors</span>
								</label>
							</li>
							<li style="margin-top: 4px; padding-top: 4px; border-top: 1px solid #ddd;">
								<span style="font-weight: bold; font-size: 0.9em;">Source</span>
							</li>
							<li>
								<label class="checkbox">
									<input type="checkbox" value="discord" v-model="app.sourceFilter"><span>Discord</span>
								</label>
							</li>
							<li>
								<label class="checkbox">
									<input type="checkbox" value="app" v-model="app.sourceFilter"><span>App</span>
								</label>
							</li>
							<li>
								<label class="checkbox">
									<input type="checkbox" value="uploader" v-model="app.sourceFilter"><span>Uploader</span>
								</label>
							</li>
							<li style="margin-top: 4px; padding-top: 4px; border-top: 1px solid #ddd;">
								<span style="font-weight: bold; font-size: 0.9em;">Discord status</span>
							</li>
							<li>
								<label class="checkbox">
									<input type="checkbox" value="claimed" v-model="app.claimedFilter"><span>Claimed</span>
								</label>
							</li>
							<li>
								<label class="checkbox">
									<input type="checkbox" value="unclaimed" v-model="app.claimedFilter"><span>Unclaimed</span>
								</label>
							</li>
							<li class="padding">
								<div class="field label prefix fill small">
									<i>today</i>
									<input type="date" v-model="app.fromDate" placeholder=" ">
									<label>Last updated</label>
								</div>
							</li>
							<li class="padding">
								<div class="field border">
									<input type="text" v-model="app.cityFilter" placeholder="Filter by city" id="city-filter-input">
								</div>
							</li>
							<li style="flex-direction:column;gap:0">
								<span>Clustering zoom level</span>
								<label class="slider tiny">
									<input min="8" max="13" type="range" v-model="app.clusteringZoom">
									<span></span>
								</label>
							</li>
							<li v-if="filtersActive">
								<button class="small max" @click="clearFilters">Clear filters</button>
							</li>
						</menu>
					<div class="field border no-margin">
						<input type="text" class="background" list="nodes" v-model="app.search" placeholder="Search Nodes" v-if="app.nodes">
						<button type="button" class="filter" :class="{ circle: !filtersActive, transparent: !filtersActive, 'error-container': filtersActive }" data-ui="#node-filter">
							<i>filter_alt</i>
							<span v-if="filtersActive">Filters active</span>
						</button>
					</div>
					<article class="search-results no-margin no-padding" v-if="searchResults?.length > 0">
						<ul class="list no-space border">
							<li v-for="node in searchResults" tabindex="0" @click="showNode(node)" @keyup.enter="showNode(node)">
								<img :src="`./img/node_types/${node.type}.svg`" width="32">
								<div class="max search-text">
									<h6 class="small" v-html="highlightString(node.adv_name, app.search)"></h6>
									<div class="search-pkey" v-html="highlightString(node.public_key, app.search)"></div>
								</div>
							</li>
						</ul>
					</article>
				</form>
			</div>
		</div>
	</body>
	<script type="module" src="./src/map.js"></script>
</html>
