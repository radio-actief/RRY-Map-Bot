<!doctype html>
<html lang="en" class="region-map-page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Map of Belgian MeshCore regions (be, be-*) — province boundaries and municipality location points"
    />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./lib/css/beer.css" />
    <link rel="stylesheet" href="./lib/css/leaflet.css" />
    <link rel="stylesheet" href="./lib/css/MarkerCluster.css" />
    <link rel="stylesheet" href="./lib/css/MarkerCluster.Default.css" />
    <title>Region codes map – #BEmesh</title>
    <style>
      :root.region-map-page {
        color-scheme: light;
      }

      /* Bridge map design tokens (style.css) → region map UI */
      body.region-map-body.map-page {
        margin: 0;
        padding: 0;
        font-family: var(--rm-font-body);
        color: var(--rm-text);
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        --rm-font-body: var(--app-font-body, "Figtree", system-ui, sans-serif);
        --rm-font-display: var(
          --app-font-display,
          "Figtree",
          system-ui,
          sans-serif
        );
        --rm-bg: var(--app-bg, #f6f5f2);
        --rm-bg-subtle: #eeedea;
        --rm-text: var(--app-text, #1a1917);
        --rm-text-muted: var(--app-text-muted, #57534e);
        --rm-accent: var(--app-accent, #d4a017);
        --rm-accent-hover: var(--app-accent-hover, #b88a14);
        --rm-surface: rgba(255, 255, 255, 0.94);
        --rm-surface-solid: rgba(252, 251, 248, 0.98);
        --rm-border: var(--app-border, #e7e5e4);
        --rm-shadow: var(--app-shadow, 0 1px 3px rgba(26, 25, 23, 0.06));
        --rm-shadow-lg: var(--app-shadow-lg, 0 4px 20px rgba(26, 25, 23, 0.08));
        --rm-shadow-hover: 0 12px 36px rgba(26, 25, 23, 0.1);
        --rm-radius: var(--app-radius, 10px);
        --rm-radius-sm: var(--app-radius-sm, 6px);
        --rm-radius-lg: 12px;
        --rm-surface-hover: rgba(250, 250, 249, 0.98);
        --rm-ease: var(--app-ease, 0.25s ease);
        background: var(--rm-bg);
        background-image:
          radial-gradient(
            ellipse 100% 60% at 50% -10%,
            rgba(212, 160, 23, 0.06),
            transparent
          ),
          linear-gradient(180deg, var(--rm-bg) 0%, var(--rm-bg-subtle) 100%);
      }

      @keyframes region-map-reveal {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .region-map-layout {
        display: flex;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
      }

      /* Map column only: keeps header from covering the sidebar / search */
      .region-map-main {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 0;
      }

      #region-map-container {
        flex: 1;
        min-width: 0;
        min-height: 0;
        z-index: 0;
      }

      .region-map-controls {
        position: relative;
        z-index: 40;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.97) 0%,
          rgba(252, 251, 248, 0.95) 100%
        );
        backdrop-filter: blur(14px) saturate(1.08);
        -webkit-backdrop-filter: blur(14px) saturate(1.08);
        border-right: 1px solid var(--rm-border);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.75) inset,
          var(--rm-shadow-lg);
        transition: width var(--rm-ease);
      }

      .region-map-controls::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 3px;
        bottom: 0;
        background: linear-gradient(
          180deg,
          rgba(212, 160, 23, 0.45) 0%,
          rgba(212, 160, 23, 0.08) 35%,
          rgba(88, 101, 242, 0.12) 100%
        );
        pointer-events: none;
        opacity: 0.9;
      }

      .region-map-controls.collapsed {
        width: 0;
        overflow: hidden;
        border-right: none;
      }

      .region-map-controls:not(.collapsed) {
        width: 300px;
      }

      /* Beer.css `.button, button { … }` sets primary fill, padding, min size — reset so
         the tab stays a slim strip and a non-font chevron stays visible (Figtree subset
         may omit ▶/◀; ::after also inherited on-primary in edge cases). */
      button.region-map-controls-toggle {
        position: fixed;
        left: 300px;
        top: 50%;
        transform: translateY(-50%);
        box-sizing: border-box;
        width: 18px;
        height: 40px;
        padding: 0 !important;
        margin: 0 !important;
        min-inline-size: 0 !important;
        min-width: 0 !important;
        block-size: auto !important;
        max-block-size: none !important;
        font-size: 0 !important;
        font-weight: 600 !important;
        border: 1px solid var(--rm-border);
        border-left: none;
        border-radius: 0 var(--rm-radius-sm) var(--rm-radius-sm) 0;
        cursor: pointer;
        color: #44403c;
        background-color: rgba(255, 255, 255, 0.98) !important;
        background-image: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(252, 251, 248, 0.94) 100%
        ) !important;
        -webkit-appearance: none;
        appearance: none;
        z-index: 1200;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
        box-shadow:
          2px 2px 10px rgba(26, 25, 23, 0.07),
          0 1px 0 rgba(255, 255, 255, 0.8) inset;
        transition:
          left var(--rm-ease),
          color var(--rm-ease),
          box-shadow var(--rm-ease);
      }

      /* Neutral “chip” look; beer.css uses primary purple + white text on bare `button`. */
      button.region-map-controls-toggle:hover {
        color: var(--rm-accent);
        box-shadow:
          2px 4px 16px rgba(212, 160, 23, 0.12),
          0 1px 0 rgba(255, 255, 255, 0.85) inset;
      }

      .region-map-controls.collapsed ~ button.region-map-controls-toggle {
        left: 0;
        border-left: 1px solid var(--rm-border);
      }

      /* Chevron lives in a child span — beer.css gives `button::after` high specificity for
         ripple overlay, which overwrote our triangle and made the strip look blank on white. */
      button.region-map-controls-toggle .region-map-controls-chevron {
        position: relative;
        z-index: 2;
        display: block;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 5px 0 5px 6px;
        border-color: transparent transparent transparent #44403c;
        transform: translateX(1px);
        flex-shrink: 0;
      }

      button.region-map-controls-toggle:hover .region-map-controls-chevron {
        border-left-color: var(--rm-accent);
      }

      .region-map-controls.collapsed
        ~ button.region-map-controls-toggle .region-map-controls-chevron {
        border-width: 5px 6px 5px 0;
        border-color: transparent #44403c transparent transparent;
        border-left-color: transparent;
        transform: translateX(-1px);
      }

      .region-map-controls.collapsed
        ~ button.region-map-controls-toggle:hover
        .region-map-controls-chevron {
        border-right-color: var(--rm-accent);
      }

      /* Top block: no vertical scroll so autocomplete is not clipped */
      .region-map-controls-inner {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }

      .region-map-controls-top {
        flex-shrink: 0;
        padding: 1rem 1rem 0.75rem;
        position: relative;
        z-index: 30;
        overflow: visible;
      }

      .region-map-controls-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 0 1rem 1rem;
        -webkit-overflow-scrolling: touch;
        border-top: 1px solid rgba(26, 25, 23, 0.06);
      }

      .region-map-controls h3 {
        margin: 0 0 0.65rem;
        font-family: var(--rm-font-display);
        font-size: 0.6875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--rm-text-muted);
      }

      .region-map-search-wrap {
        position: relative;
        z-index: 80;
      }

      .region-map-search-wrap input {
        width: 100%;
        padding: 0.6rem 0.85rem;
        font-size: 0.9375rem;
        font-family: inherit;
        border: 1px solid var(--rm-border);
        border-radius: var(--rm-radius);
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.88);
        transition:
          border-color var(--rm-ease),
          box-shadow var(--rm-ease),
          background var(--rm-ease);
      }

      .region-map-search-wrap input:hover {
        border-color: rgba(212, 160, 23, 0.28);
        background: rgba(255, 255, 255, 0.95);
      }

      .region-map-search-wrap input:focus {
        outline: none;
        border-color: var(--rm-accent);
        box-shadow:
          0 0 0 2px rgba(212, 160, 23, 0.18),
          0 2px 12px rgba(26, 25, 23, 0.06);
        background: #fff;
      }

      #autocomplete {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        margin-top: 6px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(252, 251, 248, 0.96) 100%
        );
        backdrop-filter: blur(12px) saturate(1.08);
        -webkit-backdrop-filter: blur(12px) saturate(1.08);
        border: 1px solid var(--rm-border);
        border-radius: var(--rm-radius);
        max-height: min(38dvh, 220px);
        overflow-y: auto;
        overflow-x: hidden;
        z-index: 200;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.75) inset,
          var(--rm-shadow-lg);
      }

      #autocomplete::before {
        content: "";
        display: block;
        height: 2px;
        border-radius: var(--rm-radius) var(--rm-radius) 0 0;
        background: linear-gradient(
          90deg,
          rgba(212, 160, 23, 0.55) 0%,
          rgba(212, 160, 23, 0.12) 40%,
          rgba(88, 101, 242, 0.2) 100%
        );
      }

      #autocomplete:empty,
      #autocomplete[style*="display: none"] {
        display: none !important;
      }

      .autocomplete-item {
        padding: 0.5rem 0.8rem;
        cursor: pointer;
        font-size: 0.875rem;
        border-bottom: 1px solid rgba(26, 25, 23, 0.06);
        transition: background var(--rm-ease);
      }

      .autocomplete-item:last-child {
        border-bottom: none;
        border-radius: 0 0 var(--rm-radius) var(--rm-radius);
      }

      .autocomplete-item:hover,
      .autocomplete-item.active {
        background: rgba(212, 160, 23, 0.09);
      }

      .autocomplete-item code {
        font-size: 0.78rem;
        color: var(--rm-text-muted);
      }

      #counter {
        margin-top: 0.55rem;
        font-size: 0.8125rem;
        color: var(--rm-text-muted);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        line-height: 1.35;
      }

      .spinner {
        width: 15px;
        height: 15px;
        border: 2px solid var(--rm-border);
        border-top-color: var(--rm-accent);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .region-map-overlays {
        margin-top: 0.85rem;
        padding-top: 0.85rem;
        font-size: 0.8125rem;
      }

      .region-map-overlays-title {
        margin-bottom: 0.45rem;
        font-weight: 600;
        color: var(--rm-text);
      }

      .region-map-overlays-radios {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .region-map-overlays-radios label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0;
        border-radius: var(--rm-radius-sm);
        transition: background var(--rm-ease);
      }

      .region-map-overlays-radios label:hover {
        background: rgba(212, 160, 23, 0.06);
      }

      .region-map-places-check {
        margin-top: 0.65rem;
        padding-top: 0.65rem;
        border-top: 1px solid rgba(26, 25, 23, 0.06);
      }

      .region-map-places-check label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8125rem;
      }

      .region-map-hierarchy {
        margin-top: 0.85rem;
        padding-top: 0.85rem;
        border-top: 1px solid rgba(26, 25, 23, 0.06);
        flex-shrink: 0;
      }

      .region-map-hierarchy h4 {
        margin: 0 0 0.45rem;
        font-size: 0.6875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--rm-text-muted);
      }

      .hierarchy-tree {
        font-size: 0.78rem;
        max-height: none;
        overflow: visible;
        padding: 0.35rem 0.25rem;
        border-radius: var(--rm-radius-sm);
        background: rgba(252, 251, 248, 0.65);
        border: 1px solid rgba(26, 25, 23, 0.06);
      }

      .hierarchy-node {
        padding: 0.28rem 0.35rem;
        margin: 0.05rem 0;
        cursor: pointer;
        display: block;
        color: var(--rm-text-muted);
        border-radius: 4px;
        transition:
          color var(--rm-ease),
          background var(--rm-ease);
      }

      .hierarchy-node:hover {
        color: var(--rm-accent);
        background: rgba(212, 160, 23, 0.08);
      }

      .hierarchy-node.indent-0 {
        padding-left: 0.35rem;
      }
      .hierarchy-node.indent-1 {
        padding-left: 0.65rem;
      }
      .hierarchy-node.indent-2 {
        padding-left: 1.1rem;
      }
      .hierarchy-node.indent-3 {
        padding-left: 1.55rem;
      }

      .region-map-header-bar {
        position: relative;
        flex-shrink: 0;
        padding: max(0.55rem, env(safe-area-inset-top, 0px))
          max(1rem, env(safe-area-inset-right, 0px)) 0.55rem
          max(1rem, env(safe-area-inset-left, 0px));
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.96) 0%,
          rgba(252, 251, 248, 0.9) 100%
        );
        backdrop-filter: blur(14px) saturate(1.1);
        -webkit-backdrop-filter: blur(14px) saturate(1.1);
        border-bottom: 1px solid var(--rm-border);
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.65rem 1rem;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.78) inset,
          0 4px 24px rgba(26, 25, 23, 0.06);
        animation: region-map-reveal var(--app-reveal-duration, 0.4s)
          var(--rm-ease) 0.06s both;
      }

      .region-map-header-bar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          rgba(212, 160, 23, 0.65) 0%,
          rgba(212, 160, 23, 0.14) 42%,
          rgba(88, 101, 242, 0.22) 100%
        );
        pointer-events: none;
      }

      .region-map-header-main {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        min-width: 0;
      }

      .region-map-attrib {
        margin: 0;
        font-size: 0.65rem;
        color: var(--rm-text-muted);
        max-width: 28rem;
        line-height: 1.35;
      }

      .region-map-header-bar h1 {
        margin: 0;
        font-family: var(--rm-font-display);
        font-size: clamp(0.95rem, 2.5vw, 1.15rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.25;
        color: var(--rm-text);
      }

      /* Match .stats-header-links + .back-link / .config-header-links */
      .region-map-header-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
        flex-shrink: 0;
      }

      .region-map-back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 1rem;
        font-weight: 600;
        font-size: 0.875rem;
        box-sizing: border-box;
        touch-action: manipulation;
        color: var(--rm-accent);
        text-decoration: none;
        border-radius: var(--rm-radius-lg);
        background: var(--rm-surface);
        border: 1px solid var(--rm-border);
        box-shadow: var(--rm-shadow);
        transition:
          background 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.2s ease;
      }

      .region-map-back-link:hover {
        background: var(--rm-surface-hover);
        color: var(--rm-accent-hover);
        box-shadow: var(--rm-shadow-hover);
        transform: translateY(-2px);
      }

      /* Same footprint as .config-map-btn / .stats-download-btn (mesh map shortcut) */
      .region-map-header-icon-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.25rem;
        height: 2.25rem;
        flex-shrink: 0;
        touch-action: manipulation;
        padding: 0;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.95) 0%,
          rgba(252, 251, 248, 0.9) 100%
        );
        border: 1px solid var(--rm-border);
        border-radius: var(--rm-radius);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.7) inset,
          var(--rm-shadow);
        color: var(--rm-accent);
        text-decoration: none;
        transition:
          box-shadow var(--rm-ease),
          transform 0.15s ease,
          color 0.15s ease,
          border-color var(--rm-ease);
      }

      .region-map-header-icon-btn:hover {
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.78) inset,
          var(--rm-shadow-lg);
        transform: translateY(-1px);
        color: var(--rm-accent-hover);
        border-color: rgba(212, 160, 23, 0.25);
      }

      .region-map-header-icon-btn svg {
        width: 1.15rem;
        height: 1.15rem;
      }

      /* Narrow screens: map on top, controls as bottom sheet (readable on phones) */
      @media (max-width: 768px) {
        .region-map-layout {
          flex-direction: column-reverse;
        }

        .region-map-controls:not(.collapsed) {
          width: 100%;
          max-height: min(62dvh, 520px);
          border-right: none;
          border-top: 1px solid var(--rm-border);
        }

        .region-map-controls.collapsed {
          width: 100%;
          max-height: 0;
          min-height: 0;
          overflow: hidden;
          border: none;
          pointer-events: none;
        }

        .region-map-controls.collapsed .region-map-controls-inner {
          opacity: 0;
        }

        .region-map-main {
          flex: 1;
          min-height: min(55dvh, 420px);
        }

        #region-map-container {
          flex: 1;
          min-height: 0;
        }

        button.region-map-controls-toggle {
          left: auto;
          right: max(10px, env(safe-area-inset-right, 0px));
          top: 50%;
          transform: translateY(-50%);
          border-left: 1px solid var(--rm-border);
          border-radius: var(--rm-radius-sm);
          touch-action: manipulation;
          box-shadow:
            0 2px 14px rgba(26, 25, 23, 0.1),
            0 1px 0 rgba(255, 255, 255, 0.8) inset;
        }

        .region-map-controls.collapsed ~ button.region-map-controls-toggle {
          left: auto;
          right: max(10px, env(safe-area-inset-right, 0px));
        }

        .region-map-search-wrap input {
          font-size: max(16px, 0.9375rem);
        }

        .region-map-header-bar {
          flex-direction: column;
          align-items: stretch;
        }
        .region-map-header-main {
          text-align: center;
        }
        .region-map-header-links {
          justify-content: center;
          order: -1;
        }
      }

      @media (max-height: 460px) and (orientation: landscape) {
        .region-map-header-bar {
          padding-top: max(0.35rem, env(safe-area-inset-top, 0px));
          padding-bottom: 0.35rem;
        }
        .region-map-header-bar h1 {
          font-size: clamp(0.85rem, 2.2vw, 1rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .region-map-header-bar {
          animation: none;
        }
        .region-map-back-link:hover,
        .region-map-header-icon-btn:hover {
          transform: none;
        }
      }

      /* Tooltips: match primary map card tone (see css/style.css Leaflet popups).
         Shrink-wrap width to label text (default block tooltips stretch to the map). */
      body.region-map-body .leaflet-tooltip.region-map-tooltip {
        box-sizing: border-box;
        display: inline-block;
        width: -moz-fit-content;
        width: fit-content;
        max-width: calc(100vw - 24px);
        min-width: 0;
        font-family: var(--rm-font-body);
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--rm-text);
        padding: 10px 16px;
        white-space: normal;
        word-wrap: break-word;
        overflow-wrap: break-word;
        line-height: 1.45;
        text-align: center;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(252, 251, 248, 0.96) 100%
        );
        border: 1px solid var(--rm-border);
        border-radius: var(--rm-radius);
        box-shadow: var(--rm-shadow-lg);
      }

      /* Leaflet defaults + style.css use margin:0 on content — restore inset so the
         close control does not sit on top of the first row (same role as Leaflet’s
         default 13px 24px 13px 20px margins). */
      body.region-map-body .leaflet-popup.region-locode-popup {
        text-align: start;
      }

      body.region-map-body
        .leaflet-popup.region-locode-popup
        .leaflet-popup-content {
        /* Do not use min-width:0 — Leaflet’s width probe collapses and locks 1 char/line */
        min-width: 17.5rem !important;
        max-width: min(26rem, calc(100vw - 48px)) !important;
        box-sizing: border-box;
        margin: 0 !important;
        padding: 10px 30px 12px 12px;
        white-space: normal;
      }

      body.region-map-body
        .leaflet-popup.region-locode-popup
        .leaflet-popup-content-wrapper {
        min-width: 17.5rem;
        max-width: min(26rem, calc(100vw - 48px));
        box-sizing: border-box;
      }

      body.region-map-body .node-popup.region-map-locode-popup--compact {
        /* No main-map “freshness” gray strip on the left */
        border-left: none;
        min-width: 0;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      body.region-map-body
        .node-popup.region-map-locode-popup--compact
        .node-popup__body {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      body.region-map-body .region-map-locode-popup__grid {
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: 100%;
        box-sizing: border-box;
      }

      body.region-map-body .region-map-locode-popup__pair {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px 10px;
        align-items: start;
        font-size: 0.8125rem;
        line-height: 1.4;
        width: 100%;
        box-sizing: border-box;
      }

      body.region-map-body .region-map-locode-popup__name {
        font-weight: 600;
        color: var(--rm-text);
        min-width: 0;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      body.region-map-body .region-map-locode-popup__code {
        justify-self: end;
        text-align: end;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--rm-text-muted);
      }

      body.region-map-body .region-map-locode-popup__code code {
        font: inherit;
        color: var(--rm-text);
        background: rgba(26, 25, 23, 0.06);
        border: 1px solid var(--rm-border);
        border-radius: 6px;
        padding: 2px 6px;
        white-space: normal;
        word-break: break-word;
        margin-block: 0;
      }
    </style>
  </head>
  <body class="light map-page region-map-body">
    <div class="region-map-layout">
      <div class="region-map-controls" id="controls">
        <div class="region-map-controls-inner">
          <div class="region-map-controls-top">

              <input

                spellcheck="false"
                autocomplete="off"
              />

            </div>
            <div id="counter">
              <span id="counter-text"
                >Enter a province code (be-*), be, or a place name</span
              >

            </div>
          </div>
          <div class="region-map-controls-scroll">
            <div class="region-map-overlays">
              <div class="region-map-overlays-title">Province boundaries</div>
              <div class="region-map-overlays-radios">
                <label>
                  <input type="radio" name="overlay" value="" /> Off
                </label>
                <label>
                  <input
                    type="radio"

                </label>

                <input type="checkbox" id="show-places" checked /> Show location
                points
              </label>

            <div class="region-map-hierarchy">
              <h4>Region codes</h4>
              <div class="hierarchy-tree" id="hierarchy"></div>
            </div>
          </div>
        </div>
      </div>
      <button
        type="button"
        class="region-map-controls-toggle"
        id="toggle-controls"
        title="Toggle side panel"
        aria-expanded="true"
      >
        <span class="region-map-controls-chevron" aria-hidden="true"></span>
      </button>
      <div class="region-map-main">
        <div class="region-map-header-bar">
          <div class="region-map-header-main">
            <h1>Region codes map</h1>
            <p class="region-map-attrib" aria-hidden="false">
              #BEmesh region map
            </p>
          </div>
          <nav class="region-map-header-links" aria-label="Page navigation">
            <a href="/" class="region-map-back-link">← Back to map</a>
            <a href="/region-configurator" class="region-map-back-link"
              >Regioncodes</a
            >
            <a
              href="/stats"
              class="region-map-header-icon-btn"
              title="Open statistics"
              aria-label="Open statistics"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 15h2v-4H7v4zm4 0h2v-8h-2v8zm4 0h2v-5h-2v5z"
                />

        <div id="region-map-container"></div>
      </div>

    <script src="./lib/leaflet.js"></script>
    <script src="./lib/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script>
      (function () {
        /**
         * Resolve data/ URLs for both local *.html files and Flask routes
         * /region-map and /region-configurator (with or without trailing slash).
         * Relative ./data/ from /region-map/ incorrectly becomes /region-map/data/…
         */
        function rryDataUrl(filename) {
          var p = window.location.pathname || "";
          if (/\.html?$/i.test(p)) {
            return "./data/" + filename;
          }
          if (/(?:^|\/)(region-map|region-configurator)(?:\/|$)/.test(p)) {
            return "/data/" + filename;
          }
          return "./data/" + filename;
        }

        const PROVINCE_NAMES = {
          "be-van": "Antwerpen",
          "be-vbr": "Vlaams-Brabant",
          "be-vov": "Oost-Vlaanderen",
          "be-vwv": "West-Vlaanderen",
          "be-vli": "Limburg",
          "be-bru": "Brussel",
          "be-wbr": "Waals-Brabant",
          "be-wht": "Henegouwen",
          "be-wlg": "Luik",
          "be-wna": "Namen",
          "be-wlx": "Luxemburg",
        };
        const PROVINCE_CODES = [
          "be-van",
          "be-vbr",
          "be-vov",
          "be-vwv",
          "be-vli",
          "be-bru",
          "be-wbr",
          "be-wht",
          "be-wlg",
          "be-wna",
          "be-wlx",
        ];
        /** Province label tooltips anchor at administrative capital (from be-locode pins). */
        const PROVINCE_CAPITAL_LATLNG = {
          "be-van": [51.22111, 4.39971],
          "be-vbr": [50.8792, 4.70117],
          "be-vov": [51.05383, 3.72501],
          "be-vwv": [51.20855, 3.22677],
          "be-vli": [50.93037, 5.3378],
          "be-bru": [50.84674, 4.35249],
          "be-wbr": [50.71697, 4.61042],
          "be-wht": [50.45496, 3.95196],
          "be-wlg": [50.64509, 5.57361],
          "be-wna": [50.46653, 4.86619],
          "be-wlx": [49.68346, 5.81677],
        };
        let locations = [];
        let provinceBoundariesFC = null;
        let map = null;
        let markerCluster = null;
        let provincesLayer = null;
        let overlayMode = "provinces";
        let showPlaces = true;
        let currentSearch = "";
        let lastMatches = [];
        let autocompleteIndex = -1;
        const belgiumCenter = [50.5, 4.35];
        const belgiumZoom = 8;

        function normalize(s) {
          return (s || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");
        }

        function escapeHtml(s) {
          if (s == null) return "";
          var d = document.createElement("div");
          d.textContent = String(s);
          return d.innerHTML;
        }

        /** City code + country + province name (no be-* province code). */
        function placeParentCodesLine(loc) {
          var city = (loc.city_code || "").trim();
          var provName = (PROVINCE_NAMES[loc.province_code] || "").trim();
          var parts = [];
          if (city) parts.push(city);
          parts.push("be");
          if (provName) parts.push(provName);
          return parts.join(" · ");
        }

        function placeAutocompleteLabel(loc) {
          var name = (loc.plaats || "").trim();
          return name + " — " + placeParentCodesLine(loc);
        }

        /** One row: display name (col 1) + region code (col 2). */
        function locodePopupPair(nameHtml, codeHtml) {
          return (
            '<div class="region-map-locode-popup__pair">' +
            '<span class="region-map-locode-popup__name">' +
            nameHtml +
            "</span>" +
            '<span class="region-map-locode-popup__code">' +
            codeHtml +
            "</span></div>"
          );
        }

        /** Click popup: 3 rows — place | city_code, province | be-*, Belgium | be. No title. */
        function locodePopupHtml(loc) {
          var cityName = escapeHtml((loc.plaats || loc.gemeente || "").trim());
          var cityCodeRaw = (loc.city_code || "").trim();
          var cityCodeCell = cityCodeRaw
            ? "<code>" + escapeHtml(cityCodeRaw) + "</code>"
            : '<span class="node-popup__muted">—</span>';
          var provName = escapeHtml(
            (PROVINCE_NAMES[loc.province_code] || "").trim(),
          );
          var provCodeRaw = (loc.province_code || "").trim();
          var provCodeCell = provCodeRaw
            ? "<code>" + escapeHtml(provCodeRaw) + "</code>"
            : '<span class="node-popup__muted">—</span>';
          var landName = escapeHtml("Belgium");
          var landCodeCell = "<code>be</code>";
          var rows = [
            locodePopupPair(
              cityName || '<span class="node-popup__muted">—</span>',
              cityCodeCell,
            ),
            locodePopupPair(
              provName || '<span class="node-popup__muted">—</span>',
              provCodeCell,
            ),
            locodePopupPair(landName, landCodeCell),
          ];
          return (
            '<div class="node-popup region-map-locode-popup--compact" data-status="none">' +
            '<div class="node-popup__body">' +
            '<div class="region-map-locode-popup__grid">' +
            rows.join("") +
            "</div></div></div>"
          );
        }

        /** Same popup chrome as a city point, but province + country only (no city row). */
        function provinceLocodePopupHtml(provinceCode) {
          var pc = (provinceCode || "").trim();
          var provName = escapeHtml((PROVINCE_NAMES[pc] || "").trim());
          var provCodeCell = pc
            ? "<code>" + escapeHtml(pc) + "</code>"
            : '<span class="node-popup__muted">—</span>';
          var landName = escapeHtml("Belgium");
          var landCodeCell = "<code>be</code>";
          var rows = [
            locodePopupPair(
              provName || '<span class="node-popup__muted">—</span>',
              provCodeCell,
            ),
            locodePopupPair(landName, landCodeCell),
          ];
          return (
            '<div class="node-popup region-map-locode-popup--compact" data-status="none">' +
            '<div class="node-popup__body">' +
            '<div class="region-map-locode-popup__grid">' +
            rows.join("") +
            "</div></div></div>"
          );
        }

        var REGION_LOCODE_POPUP_OPTS = {
          /* Leaflet measures content width with nowrap; minWidth avoids a 1-char-wide box */
          minWidth: 280,
          maxWidth: 400,
          className: "region-locode-popup",
        };

        var REGION_MAP_TOOLTIP_OPTS = {
          permanent: false,
          direction: "auto",
          className: "region-map-tooltip",
        };

        /**
         * Show province name tooltip fixed above the provincial capital (not under the cursor),
         * so it stays readable while moving over the polygon.
         */
        function attachProvinceHoverTooltip(layer, provinceCode) {
          var code = provinceCode;
          var label = PROVINCE_NAMES[code] || code;
          var cap = PROVINCE_CAPITAL_LATLNG[code];
          function clearTip() {
            if (layer._rmProvinceHoverTip && map) {
              try {
                map.removeLayer(layer._rmProvinceHoverTip);
              } catch (e) {
                /* ignore */
              }
              layer._rmProvinceHoverTip = null;
            }
          }
          layer.on("mouseover", function () {
            if (layer._rmProvinceHoverTip || !map) return;
            var latlng;
            try {
              if (cap && cap.length >= 2) {
                latlng = L.latLng(cap[0], cap[1]);
              } else if (layer.getBounds && layer.getBounds().isValid()) {
                latlng = layer.getBounds().getCenter();
              }
            } catch (e2) {
              latlng = null;
            }
            if (!latlng) return;
            var tip = L.tooltip(
              Object.assign({}, REGION_MAP_TOOLTIP_OPTS, {
                direction: "top",
                sticky: false,
                offset: L.point(0, -10),
              }),
            )
              .setContent(label)
              .setLatLng(latlng)
              .addTo(map);
            layer._rmProvinceHoverTip = tip;
          });
          layer.on("mouseout", clearTip);
          layer.on("remove", clearTip);
        }

        function locationMatchesQuery(loc, q) {
          if (
            normalize(loc.plaats).includes(q) ||
            normalize(loc.gemeente).includes(q)
          )
            return true;
          var al = loc.search_aliases;
          if (!al || !al.length) return false;
          for (var i = 0; i < al.length; i++) {
            if (normalize(al[i]).includes(q)) return true;
          }
          return false;
        }

        function getLocationsWithCoords() {
          return locations.filter(function (loc) {
            return loc.lat && loc.lon;
          });
        }

        function pointsToFeatureCollection(points) {
          return {
            type: "FeatureCollection",
            features: points.map(function (p) {
              return {
                type: "Feature",
                geometry: { type: "Point", coordinates: [p.lon, p.lat] },
                properties: {},
              };
            }),
          };
        }

        function buildHullFromPoints(points, maxEdgeKm) {
          if (!points.length || typeof turf === "undefined") return null;
          if (points.length < 3) return null;
          var fc = pointsToFeatureCollection(points);
          var hull = null;
          try {
            if (turf.concave) {
              hull = turf.concave(fc, {
                maxEdge: maxEdgeKm || 50,
                units: "kilometers",
              });
            }
          } catch (e) {}
          if (!hull && turf.convex) {
            try {
              hull = turf.convex(fc);
            } catch (e2) {}
          }
          return hull;
        }

        function buildProvinceAreas() {
          var layers = {};
          var withCoords = getLocationsWithCoords();
          PROVINCE_CODES.forEach(function (code) {
            var pts = withCoords.filter(function (l) {
              return l.province_code === code;
            });
            var hull = buildHullFromPoints(pts, 50);
            if (hull) layers[code] = hull;
          });
          return layers;
        }

        /** One distinct fill + outline per province (not by region / gewest). */
        function getOverlayStyle(code) {
          var palette = {
            "be-van": { fill: "#e63946", line: "rgba(157, 34, 53, 0.45)" },
            "be-vbr": { fill: "#4361ee", line: "rgba(42, 63, 158, 0.45)" },
            "be-vov": { fill: "#2a9d8f", line: "rgba(23, 107, 98, 0.45)" },
            "be-vwv": { fill: "#219ebc", line: "rgba(20, 90, 110, 0.45)" },
            "be-vli": { fill: "#8ac926", line: "rgba(74, 110, 20, 0.45)" },
            "be-bru": { fill: "#9b5de5", line: "rgba(90, 45, 158, 0.45)" },
            "be-wbr": { fill: "#f4a261", line: "rgba(166, 95, 24, 0.45)" },
            "be-wht": { fill: "#e76f51", line: "rgba(154, 69, 46, 0.45)" },
            "be-wlg": { fill: "#bc6c25", line: "rgba(107, 61, 21, 0.45)" },
            "be-wna": { fill: "#7b2cbf", line: "rgba(74, 20, 140, 0.45)" },
            "be-wlx": { fill: "#06d6a0", line: "rgba(4, 122, 92, 0.45)" },
          };
          var p = palette[code];
          if (!p) {
            return {
              fillColor: "#b0b0b0",
              fillOpacity: 0.16,
              color: "rgba(0, 0, 0, 0.32)",
              weight: 1,
            };
          }
          return {
            fillColor: p.fill,
            fillOpacity: 0.22,
            color: p.line,
            weight: 1.25,
          };
        }

        function boundsFromProvinceGeoCode(pc) {
          if (!provinceBoundariesFC || !provinceBoundariesFC.features)
            return null;
          var i;
          for (i = 0; i < provinceBoundariesFC.features.length; i++) {
            var f = provinceBoundariesFC.features[i];
            if (f.properties && f.properties.code === pc) {
              try {
                var tmp = L.geoJSON(f);
                var b = tmp.getBounds();
                tmp.remove();
                if (b && b.isValid()) return b;
              } catch (e) {}
            }
          }
          return null;
        }

        function fitAllProvincesBounds() {
          if (!map) return;
          if (
            provinceBoundariesFC &&
            provinceBoundariesFC.features &&
            provinceBoundariesFC.features.length
          ) {
            try {
              var ly = L.geoJSON(provinceBoundariesFC);
              var bb = ly.getBounds();
              ly.remove();
              if (bb && bb.isValid()) {
                map.fitBounds(bb, { padding: [24, 24] });
                return;
              }
            } catch (e2) {}
          }
          map.setView(belgiumCenter, belgiumZoom);
        }

        function fitProvincePolygonBounds(pc) {
          var b = boundsFromProvinceGeoCode(pc);
          if (b && map && b.isValid()) map.fitBounds(b, { padding: [20, 20] });
        }

        function addCircleMarkersToContainer(container, matched) {
          matched.forEach(function (loc) {
            var circle = L.circleMarker([loc.lat, loc.lon], {
              radius: 6,
              fillColor: "#2563eb",
              color: "#1d4ed8",
              weight: 1,
              fillOpacity: 0.9,
            });
            circle.bindPopup(locodePopupHtml(loc), REGION_LOCODE_POPUP_OPTS);
            circle.bindTooltip(
              (loc.plaats || loc.gemeente || "").trim() || "—",
              REGION_MAP_TOOLTIP_OPTS,
            );
            container.addLayer(circle);
          });
        }

        function updateOverlays() {
          if (markerCluster) {
            map.removeLayer(markerCluster);
            markerCluster = null;
          }
          if (provincesLayer) {
            map.removeLayer(provincesLayer);
            provincesLayer = null;
          }
          if (overlayMode === "provinces") {
            if (
              provinceBoundariesFC &&
              provinceBoundariesFC.features &&
              provinceBoundariesFC.features.length
            ) {
              provincesLayer = L.geoJSON(provinceBoundariesFC, {
                style: function (feat) {
                  return getOverlayStyle(feat.properties.code);
                },
                onEachFeature: function (feat, layer) {
                  var c = feat.properties.code;
                  attachProvinceHoverTooltip(layer, c);
                  layer.bindPopup(
                    provinceLocodePopupHtml(c),
                    REGION_LOCODE_POPUP_OPTS,
                  );
                },
              });
              map.addLayer(provincesLayer);
            } else if (typeof turf !== "undefined") {
              var areas = buildProvinceAreas();
              var features = [];
              for (var code in areas) {
                if (areas[code]) {
                  var feat = areas[code];
                  var geom = feat.geometry || feat;
                  var props = feat.properties
                    ? Object.assign({}, feat.properties, { code: code })
                    : { code: code };
                  var f =
                    turf && turf.feature
                      ? turf.feature(geom, props)
                      : {
                          type: "Feature",
                          geometry: geom,
                          properties: props,
                        };
                  features.push(f);
                }
              }
              if (features.length) {
                provincesLayer = L.geoJSON(
                  { type: "FeatureCollection", features: features },
                  {
                    style: function (f) {
                      return getOverlayStyle(f.properties.code);
                    },
                    onEachFeature: function (f, layer) {
                      var pc = f.properties.code;
                      attachProvinceHoverTooltip(layer, pc);
                      layer.bindPopup(
                        provinceLocodePopupHtml(pc),
                        REGION_LOCODE_POPUP_OPTS,
                      );
                    },
                  },
                );
                map.addLayer(provincesLayer);
              }
            }
          }
          if (showPlaces && lastMatches.length) {
            var useCluster =
              typeof L.markerClusterGroup === "function" &&
              lastMatches.length > 50;
            if (useCluster) {
              markerCluster = L.markerClusterGroup({
                maxClusterRadius: 55,
                chunkedLoading: lastMatches.length > 400,
              });
              addCircleMarkersToContainer(markerCluster, lastMatches);
            } else {
              markerCluster = L.featureGroup();
              addCircleMarkersToContainer(markerCluster, lastMatches);
            }
            map.addLayer(markerCluster);
          }
        }

        function matchLocations(query) {
          if (!query || !query.trim()) return getLocationsWithCoords();
          var q = normalize(query.trim());
          /* Country code be = all municipality points with coordinates */
          if (q === "be") return getLocationsWithCoords();
          return locations.filter(function (loc) {
            if (!loc.lat || !loc.lon) return false;
            if (loc.city_code === q || normalize(loc.city_code).includes(q))
              return true;
            if (
              loc.province_code === q ||
              normalize(loc.province_code).includes(q)
            )
              return true;
            if (locationMatchesQuery(loc, q)) return true;
            return false;
          });
        }

        function buildAutocompleteItems(query) {
          if (!query || query.length < 2) return [];
          var q = normalize(query);
          var items = [];
          var seen = new Set();
          var belMatch =
            q === "be" ||
            normalize("belgium").includes(q) ||
            normalize("belgie").includes(q) ||
            normalize("belgië").includes(q) ||
            normalize("belgique").includes(q);
          if (belMatch) {
            items.push({
              type: "country",
              code: "be",
              label: "Belgium (be) — country",
            });
            seen.add("__be__");
          }
          PROVINCE_CODES.forEach(function (c) {
            if (
              normalize(c).includes(q) ||
              normalize(PROVINCE_NAMES[c] || "").includes(q)
            ) {
              if (!seen.has(c)) {
                seen.add(c);
                items.push({
                  type: "province",
                  code: c,
                  label: (PROVINCE_NAMES[c] || c) + " (" + c + ")",
                });
              }
            }
          });
          locations.forEach(function (loc) {
            if (items.length >= 15) return;
            if (!loc.lat || !loc.lon) return;
            if (
              normalize(loc.city_code).includes(q) ||
              locationMatchesQuery(loc, q)
            ) {
              var key = loc.city_code;
              if (!seen.has(key)) {
                seen.add(key);
                items.push({
                  type: "place",
                  code: loc.city_code,
                  label: placeAutocompleteLabel(loc),
                });
              }
            }
          });
          return items.slice(0, 12);
        }

        function showAutocomplete(items) {
          var ac = document.getElementById("autocomplete");
          ac.innerHTML = "";
          ac.style.display = "none";
          if (!items.length) return;
          items.forEach(function (item, i) {
            var el = document.createElement("div");
            el.className =
              "autocomplete-item" + (i === autocompleteIndex ? " active" : "");
            el.textContent = item.label;
            el.dataset.index = i;
            el.dataset.code = item.code;
            el.dataset.type = item.type || "place";
            el.addEventListener("click", function () {
              runCodeSearch(item.code, item.type);
              ac.innerHTML = "";
              ac.style.display = "none";
            });
            ac.appendChild(el);
          });
          ac.style.display = "block";
          autocompleteIndex = 0;
          var firstAc = ac.querySelector(".autocomplete-item");
          if (firstAc) firstAc.classList.add("active");
        }

        function runCodeSearch(code, type) {
          var input = document.getElementById("code-input");
          if (input) input.value = code;
          currentSearch = code;
          var matched = matchLocations(code);
          lastMatches = matched;
          var normCode = (code || "").trim().toLowerCase();
          var t = type || "";
          if (t === "province" || PROVINCE_CODES.indexOf(normCode) >= 0) {
            fitProvincePolygonBounds(normCode);
          } else if (t === "country" || normCode === "be") {
            fitAllProvincesBounds();
          }
          updateMap(matched);
          updateCounter(matched.length);
        }

        function updateCounter(count) {
          var txt = document.getElementById("counter-text");
          var sp = document.getElementById("spinner");
          if (sp) sp.style.display = "none";
          var normQ = normalize((currentSearch || "").trim());
          if (count === undefined) {
            if (!currentSearch) {
              txt.textContent =
                "Enter a province code (be-*), be, or a place name";
            } else if (normQ === "be") {
              var bn = lastMatches ? lastMatches.length : 0;
              txt.textContent =
                bn === 0
                  ? "Belgium — no location points on the map"
                  : bn + " location points in Belgium";
            } else {
              txt.textContent =
                lastMatches.length + " location points in search result";
            }
          } else {
            if (normQ === "be" && count === 0) {
              txt.textContent = "Belgium — no location points on the map";
            } else if (normQ === "be") {
              txt.textContent = count + " location points shown in Belgium";
            } else {
              txt.textContent = count + " location points shown";
            }
          }
        }

        function updateMap(matched) {
          if (!map) return;
          if (markerCluster) {
            map.removeLayer(markerCluster);
            markerCluster = null;
          }
          if (!showPlaces || !matched.length) {
            updateCounter(matched ? matched.length : 0);
            if (matched && matched.length === 1) {
              map.setView([matched[0].lat, matched[0].lon], 12);
            } else if (matched && matched.length > 1 && matched.length < 30) {
              var b = L.latLngBounds(
                matched.map(function (l) {
                  return [l.lat, l.lon];
                }),
              );
              map.fitBounds(b, { padding: [30, 30] });
            }
            return;
          }
          var useCluster =
            typeof L.markerClusterGroup === "function" && matched.length > 50;
          if (useCluster) {
            markerCluster = L.markerClusterGroup({
              maxClusterRadius: 55,
              chunkedLoading: matched.length > 400,
            });
            addCircleMarkersToContainer(markerCluster, matched);
          } else {
            markerCluster = L.featureGroup();
            addCircleMarkersToContainer(markerCluster, matched);
          }
          map.addLayer(markerCluster);
          updateCounter(matched.length);
          if (matched.length === 1) {
            map.setView([matched[0].lat, matched[0].lon], 12);
          } else if (matched.length < 30) {
            var bounds = L.latLngBounds(
              matched.map(function (l) {
                return [l.lat, l.lon];
              }),
            );
            map.fitBounds(bounds, { padding: [30, 30] });
          }
        }

        function buildHierarchy() {
          var withCoords = getLocationsWithCoords();
          var html =
            '<div class="hierarchy-node indent-0" data-code="be" data-type="country">Belgium (be)</div>';
          PROVINCE_CODES.forEach(function (p) {
            var locs = withCoords.filter(function (l) {
              return l.province_code === p;
            });
            if (!locs.length) return;
            html +=
              '<div class="hierarchy-node indent-1" data-code="' +
              p +
              '" data-type="province">' +
              (PROVINCE_NAMES[p] || p) +
              " (" +
              p +
              ") [" +
              locs.length +
              "]</div>";
          });
          var el = document.getElementById("hierarchy");
          if (el) {
            el.innerHTML = html;
            el.querySelectorAll(".hierarchy-node").forEach(function (n) {
              n.addEventListener("click", function () {
                runCodeSearch(n.dataset.code, n.dataset.type);
              });
            });
          }
        }

        function init() {
          map = L.map("region-map-container").setView(
            belgiumCenter,
            belgiumZoom,
          );
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          }).addTo(map);

          document
            .getElementById("toggle-controls")
            .addEventListener("click", function () {
              var panel = document.getElementById("controls");
              panel.classList.toggle("collapsed");
              var expanded = !panel.classList.contains("collapsed");
              this.setAttribute("aria-expanded", expanded ? "true" : "false");
              window.setTimeout(function () {
                if (map) map.invalidateSize({ animate: false });
              }, 280);
            });

          window.addEventListener("resize", function () {
            if (map) map.invalidateSize({ animate: false });
          });
          var rmVV = window.visualViewport;
          if (rmVV) {
            rmVV.addEventListener("resize", function () {
              if (map) map.invalidateSize({ animate: false });
            });
          }
          window.addEventListener("orientationchange", function () {
            window.setTimeout(function () {
              if (map) map.invalidateSize({ animate: false });
            }, 400);
          });

          document
            .querySelectorAll('input[name="overlay"]')
            .forEach(function (r) {
              r.addEventListener("change", function () {
                overlayMode = this.value;
                updateOverlays();
              });
            });

          document
            .getElementById("show-places")
            .addEventListener("change", function () {
              showPlaces = this.checked;
              updateMap(
                lastMatches.length
                  ? lastMatches
                  : matchLocations(currentSearch),
              );
            });

          var input = document.getElementById("code-input");
          input.addEventListener("input", function () {
            var items = buildAutocompleteItems(this.value);
            showAutocomplete(items);
            if (!items.length && this.value.trim()) {
              var raw = this.value.trim();
              var m = matchLocations(raw);
              lastMatches = m;
              currentSearch = raw;
              var nc = normalize(raw);
              if (PROVINCE_CODES.indexOf(nc) >= 0) {
                fitProvincePolygonBounds(nc);
              } else if (nc === "be") {
                fitAllProvincesBounds();
              }
              updateMap(m);
              updateCounter(m.length);
            }
          });

          input.addEventListener("keydown", function (e) {
            var ac = document.getElementById("autocomplete");
            var items = ac.querySelectorAll(".autocomplete-item");
            if (e.key === "ArrowDown") {
              e.preventDefault();
              autocompleteIndex = Math.min(
                autocompleteIndex + 1,
                items.length - 1,
              );
              items.forEach(function (el, i) {
                el.classList.toggle("active", i === autocompleteIndex);
              });
            } else if (e.key === "ArrowUp") {
              e.preventDefault();
              autocompleteIndex = Math.max(autocompleteIndex - 1, 0);
              items.forEach(function (el, i) {
                el.classList.toggle("active", i === autocompleteIndex);
              });
            } else if (e.key === "Enter" && items[autocompleteIndex]) {
              e.preventDefault();
              var it = items[autocompleteIndex];
              runCodeSearch(it.dataset.code, it.dataset.type || "place");
              ac.innerHTML = "";
              ac.style.display = "none";
            } else if (e.key === "Escape") {
              ac.innerHTML = "";
              ac.style.display = "none";
            }
          });

          input.addEventListener("focus", function () {
            var items = buildAutocompleteItems(this.value);
            if (items.length) showAutocomplete(items);
          });

          document.addEventListener("click", function (e) {
            if (!e.target.closest(".region-map-search-wrap")) {
              document.getElementById("autocomplete").innerHTML = "";
              document.getElementById("autocomplete").style.display = "none";
            }
          });

          Promise.all([
            fetch(rryDataUrl("be-locode.json"))
              .then(function (r) {
                if (!r.ok) return [];
                return r.json().catch(function () {
                  return [];
                });
              })
              .then(function (data) {
                return Array.isArray(data) ? data : [];
              }),
            fetch(rryDataUrl("be-provinces.geojson")).then(function (r) {
              if (!r.ok) return null;
              return r.json().catch(function () {
                return null;
              });
            }),
          ])
            .then(function (results) {
              locations = results[0] || [];
              provinceBoundariesFC = results[1];
              var pr = document.querySelector(
                'input[name="overlay"][value="provinces"]',
              );
              if (pr) pr.checked = true;
              overlayMode = "provinces";
              buildHierarchy();
              updateOverlays();
              /* Same as clicking hierarchy indent-0 Belgium (be) */
              runCodeSearch("be", "country");
              if (map) map.invalidateSize({ animate: false });
            })
            .catch(function () {
              locations = [];
              provinceBoundariesFC = null;
              document.getElementById("counter-text").textContent =
                "Could not load locations.";
            });
        }

        init();
      })();
    </script>
  </body>
</html>
