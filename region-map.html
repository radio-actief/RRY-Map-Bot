<!doctype html>
<html lang="nl" class="region-map-page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Kaart van Belgische regioncodes – typ een code om plaatsen te markeren"
    />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./lib/css/beer.css" />
    <link rel="stylesheet" href="./lib/css/leaflet.css" />
    <title>Kaart Regioncodes – #BEmesh Map</title>
    <style>
      :root.region-map-page {
        color-scheme: light;
      }

      /* Bridge map design tokens (style.css) → region map UI */
      body.region-map-body.map-page {
        margin: 0;
        padding: 0;
        font-family: var(--rm-font-body);
        color: var(--rm-text);
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        --rm-font-body: var(--app-font-body, "Figtree", system-ui, sans-serif);
        --rm-font-display: var(--app-font-display, "Figtree", system-ui, sans-serif);
        --rm-bg: var(--app-bg, #f6f5f2);
        --rm-bg-subtle: #eeedea;
        --rm-text: var(--app-text, #1a1917);
        --rm-text-muted: var(--app-text-muted, #57534e);
        --rm-accent: var(--app-accent, #d4a017);
        --rm-accent-hover: var(--app-accent-hover, #b88a14);
        --rm-surface: rgba(255, 255, 255, 0.94);
        --rm-surface-solid: rgba(252, 251, 248, 0.98);
        --rm-border: var(--app-border, #e7e5e4);
        --rm-shadow: var(--app-shadow, 0 1px 3px rgba(26, 25, 23, 0.06));
        --rm-shadow-lg: var(--app-shadow-lg, 0 4px 20px rgba(26, 25, 23, 0.08));
        --rm-radius: var(--app-radius, 10px);
        --rm-radius-sm: var(--app-radius-sm, 6px);
        --rm-ease: var(--app-ease, 0.25s ease);
        background: var(--rm-bg);
        background-image:
          radial-gradient(
            ellipse 100% 60% at 50% -10%,
            rgba(212, 160, 23, 0.06),
            transparent
          ),
          linear-gradient(180deg, var(--rm-bg) 0%, var(--rm-bg-subtle) 100%);
      }

      @keyframes region-map-reveal {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .region-map-layout {
        display: flex;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
      }

      #region-map-container {
        flex: 1;
        min-width: 0;
        height: 100%;
        z-index: 0;
      }

      .region-map-controls {
        position: relative;
        z-index: 40;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.97) 0%,
          rgba(252, 251, 248, 0.95) 100%
        );
        backdrop-filter: blur(14px) saturate(1.08);
        -webkit-backdrop-filter: blur(14px) saturate(1.08);
        border-right: 1px solid var(--rm-border);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.75) inset,
          var(--rm-shadow-lg);
        transition: width var(--rm-ease);
      }

      .region-map-controls::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 3px;
        bottom: 0;
        background: linear-gradient(
          180deg,
          rgba(212, 160, 23, 0.45) 0%,
          rgba(212, 160, 23, 0.08) 35%,
          rgba(88, 101, 242, 0.12) 100%
        );
        pointer-events: none;
        opacity: 0.9;
      }

      .region-map-controls.collapsed {
        width: 0;
        overflow: hidden;
        border-right: none;
      }

      .region-map-controls:not(.collapsed) {
        width: 300px;
      }

      .region-map-controls-toggle {
        position: fixed;
        left: 300px;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 52px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(252, 251, 248, 0.94) 100%
        );
        border: 1px solid var(--rm-border);
        border-left: none;
        border-radius: 0 var(--rm-radius-sm) var(--rm-radius-sm) 0;
        cursor: pointer;
        font-size: 10px;
        color: var(--rm-text-muted);
        z-index: 1200;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          2px 2px 10px rgba(26, 25, 23, 0.07),
          0 1px 0 rgba(255, 255, 255, 0.8) inset;
        transition:
          left var(--rm-ease),
          color var(--rm-ease),
          box-shadow var(--rm-ease);
      }

      .region-map-controls-toggle:hover {
        color: var(--rm-accent);
        box-shadow:
          2px 4px 16px rgba(212, 160, 23, 0.12),
          0 1px 0 rgba(255, 255, 255, 0.85) inset;
      }

      .region-map-controls.collapsed ~ .region-map-controls-toggle {
        left: 0;
        border-left: 1px solid var(--rm-border);
      }

      .region-map-controls-toggle::after {
        content: "▶";
      }

      .region-map-controls.collapsed ~ .region-map-controls-toggle::after {
        content: "◀";
      }

      /* Top block: no vertical scroll so autocomplete is not clipped */
      .region-map-controls-inner {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }

      .region-map-controls-top {
        flex-shrink: 0;
        padding: 1rem 1rem 0.75rem;
        position: relative;
        z-index: 30;
        overflow: visible;
      }

      .region-map-controls-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 0 1rem 1rem;
        -webkit-overflow-scrolling: touch;
        border-top: 1px solid rgba(26, 25, 23, 0.06);
      }

      .region-map-controls h3 {
        margin: 0 0 0.65rem;
        font-family: var(--rm-font-display);
        font-size: 0.6875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--rm-text-muted);
      }

      .region-map-search-wrap {
        position: relative;
        z-index: 50;
      }

      .region-map-search-wrap input {
        width: 100%;
        padding: 0.6rem 0.85rem;
        font-size: 0.9375rem;
        font-family: inherit;
        border: 1px solid var(--rm-border);
        border-radius: var(--rm-radius);
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.88);
        transition:
          border-color var(--rm-ease),
          box-shadow var(--rm-ease),
          background var(--rm-ease);
      }

      .region-map-search-wrap input:hover {
        border-color: rgba(212, 160, 23, 0.28);
        background: rgba(255, 255, 255, 0.95);
      }

      .region-map-search-wrap input:focus {
        outline: none;
        border-color: var(--rm-accent);
        box-shadow:
          0 0 0 2px rgba(212, 160, 23, 0.18),
          0 2px 12px rgba(26, 25, 23, 0.06);
        background: #fff;
      }

      #autocomplete {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        margin-top: 6px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(252, 251, 248, 0.96) 100%
        );
        backdrop-filter: blur(12px) saturate(1.08);
        -webkit-backdrop-filter: blur(12px) saturate(1.08);
        border: 1px solid var(--rm-border);
        border-radius: var(--rm-radius);
        max-height: min(38dvh, 220px);
        overflow-y: auto;
        overflow-x: hidden;
        z-index: 200;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.75) inset,
          var(--rm-shadow-lg);
      }

      #autocomplete::before {
        content: "";
        display: block;
        height: 2px;
        border-radius: var(--rm-radius) var(--rm-radius) 0 0;
        background: linear-gradient(
          90deg,
          rgba(212, 160, 23, 0.55) 0%,
          rgba(212, 160, 23, 0.12) 40%,
          rgba(88, 101, 242, 0.2) 100%
        );
      }

      #autocomplete:empty,
      #autocomplete[style*="display: none"] {
        display: none !important;
      }

      .autocomplete-item {
        padding: 0.5rem 0.8rem;
        cursor: pointer;
        font-size: 0.875rem;
        border-bottom: 1px solid rgba(26, 25, 23, 0.06);
        transition: background var(--rm-ease);
      }

      .autocomplete-item:last-child {
        border-bottom: none;
        border-radius: 0 0 var(--rm-radius) var(--rm-radius);
      }

      .autocomplete-item:hover,
      .autocomplete-item.active {
        background: rgba(212, 160, 23, 0.09);
      }

      .autocomplete-item code {
        font-size: 0.78rem;
        color: var(--rm-text-muted);
      }

      #counter {
        margin-top: 0.55rem;
        font-size: 0.8125rem;
        color: var(--rm-text-muted);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        line-height: 1.35;
      }

      .spinner {
        width: 15px;
        height: 15px;
        border: 2px solid var(--rm-border);
        border-top-color: var(--rm-accent);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .region-map-overlays {
        margin-top: 0.85rem;
        padding-top: 0.85rem;
        font-size: 0.8125rem;
      }

      .region-map-overlays-title {
        margin-bottom: 0.45rem;
        font-weight: 600;
        color: var(--rm-text);
      }

      .region-map-overlays-radios {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .region-map-overlays-radios label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0;
        border-radius: var(--rm-radius-sm);
        transition: background var(--rm-ease);
      }

      .region-map-overlays-radios label:hover {
        background: rgba(212, 160, 23, 0.06);
      }

      .region-map-places-check {
        margin-top: 0.65rem;
        padding-top: 0.65rem;
        border-top: 1px solid rgba(26, 25, 23, 0.06);
      }

      .region-map-places-check label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8125rem;
      }

      .region-map-hierarchy {
        margin-top: 0.85rem;
        padding-top: 0.85rem;
        border-top: 1px solid rgba(26, 25, 23, 0.06);
      }

      .region-map-hierarchy h4 {
        margin: 0 0 0.45rem;
        font-size: 0.6875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--rm-text-muted);
      }

      .hierarchy-tree {
        font-size: 0.78rem;
        max-height: min(42dvh, 360px);
        overflow-y: auto;
        overflow-x: hidden;
        padding: 0.35rem 0.25rem;
        border-radius: var(--rm-radius-sm);
        background: rgba(252, 251, 248, 0.65);
        border: 1px solid rgba(26, 25, 23, 0.06);
      }

      .hierarchy-node {
        padding: 0.28rem 0.35rem;
        margin: 0.05rem 0;
        cursor: pointer;
        display: block;
        color: var(--rm-text-muted);
        border-radius: 4px;
        transition:
          color var(--rm-ease),
          background var(--rm-ease);
      }

      .hierarchy-node:hover {
        color: var(--rm-accent);
        background: rgba(212, 160, 23, 0.08);
      }

      .hierarchy-node.indent-0 {
        padding-left: 0.35rem;
      }
      .hierarchy-node.indent-1 {
        padding-left: 0.65rem;
      }
      .hierarchy-node.indent-2 {
        padding-left: 1.1rem;
      }
      .hierarchy-node.indent-3 {
        padding-left: 1.55rem;
      }

      .region-map-header-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: max(0.55rem, env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px))
          0.55rem max(1rem, env(safe-area-inset-left, 0px));
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.96) 0%,
          rgba(252, 251, 248, 0.9) 100%
        );
        backdrop-filter: blur(14px) saturate(1.1);
        -webkit-backdrop-filter: blur(14px) saturate(1.1);
        border-bottom: 1px solid var(--rm-border);
        z-index: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.65rem 1rem;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.78) inset,
          0 4px 24px rgba(26, 25, 23, 0.06);
        animation: region-map-reveal var(--app-reveal-duration, 0.4s) var(--rm-ease)
          0.06s both;
      }

      .region-map-header-bar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          rgba(212, 160, 23, 0.65) 0%,
          rgba(212, 160, 23, 0.14) 42%,
          rgba(88, 101, 242, 0.22) 100%
        );
        pointer-events: none;
      }

      .region-map-header-main {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        min-width: 0;
      }

      .region-map-header-bar h1 {
        margin: 0;
        font-family: var(--rm-font-display);
        font-size: clamp(0.95rem, 2.5vw, 1.15rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.25;
        color: var(--rm-text);
      }

      .region-map-badge {
        display: inline-block;
        font-size: 0.58rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--rm-accent-hover);
        background: linear-gradient(
          135deg,
          rgba(212, 160, 23, 0.18),
          rgba(212, 160, 23, 0.07)
        );
        padding: 0.22rem 0.5rem;
        border-radius: 999px;
        border: 1px solid rgba(212, 160, 23, 0.28);
        vertical-align: middle;
        margin-left: 0.4rem;
      }

      .region-map-header-nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
      }

      .region-map-header-bar a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.4rem 0.7rem;
        min-height: 2.25rem;
        box-sizing: border-box;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--rm-accent);
        text-decoration: none;
        border-radius: var(--rm-radius-sm);
        background: rgba(255, 255, 255, 0.65);
        border: 1px solid var(--rm-border);
        box-shadow: var(--rm-shadow);
        transition:
          background var(--rm-ease),
          color var(--rm-ease),
          box-shadow var(--rm-ease),
          transform var(--rm-ease);
      }

      .region-map-header-bar a:hover {
        color: var(--rm-accent-hover);
        background: rgba(255, 255, 255, 0.95);
        box-shadow: var(--rm-shadow-lg);
        transform: translateY(-1px);
      }

      /* Narrow screens: map on top, controls as bottom sheet (readable on phones) */
      @media (max-width: 768px) {
        .region-map-layout {
          flex-direction: column-reverse;
        }

        .region-map-controls:not(.collapsed) {
          width: 100%;
          max-height: min(44dvh, 340px);
          border-right: none;
          border-top: 1px solid var(--rm-border);
        }

        .region-map-controls.collapsed {
          width: 100%;
          max-height: 0;
          min-height: 0;
          overflow: hidden;
          border: none;
          pointer-events: none;
        }

        .region-map-controls.collapsed .region-map-controls-inner {
          opacity: 0;
        }

        #region-map-container {
          flex: 1;
          min-height: min(55dvh, 420px);
        }

        .region-map-controls-toggle {
          left: auto;
          right: max(10px, env(safe-area-inset-right, 0px));
          top: 50%;
          transform: translateY(-50%);
          border-left: 1px solid var(--rm-border);
          border-radius: var(--rm-radius-sm);
          touch-action: manipulation;
          box-shadow:
            0 2px 14px rgba(26, 25, 23, 0.1),
            0 1px 0 rgba(255, 255, 255, 0.8) inset;
        }

        .region-map-controls.collapsed ~ .region-map-controls-toggle {
          left: auto;
          right: max(10px, env(safe-area-inset-right, 0px));
        }

        .region-map-search-wrap input {
          font-size: max(16px, 0.9375rem);
        }

        .hierarchy-tree {
          max-height: min(28dvh, 220px);
        }
      }

      @media (max-height: 460px) and (orientation: landscape) {
        .region-map-header-bar {
          padding-top: max(0.35rem, env(safe-area-inset-top, 0px));
          padding-bottom: 0.35rem;
        }
        .region-map-header-bar h1 {
          font-size: clamp(0.85rem, 2.2vw, 1rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .region-map-header-bar {
          animation: none;
        }
        .region-map-header-bar a:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body class="light map-page region-map-body">
    <div class="region-map-layout">
      <div class="region-map-controls" id="controls">
        <div class="region-map-controls-inner">
          <div class="region-map-controls-top">
            <h3>Regioncode opzoeken</h3>
            <div class="region-map-search-wrap">
              <input
                id="code-input"
                type="text"
                placeholder="bijv. be-vwv, behar, gent"
                spellcheck="false"
                autocomplete="off"
              />
              <div id="autocomplete"></div>
            </div>
            <div id="counter">
              <span id="counter-text">Typ een regioncode of plaatsnaam</span>
              <div class="spinner" id="spinner" style="display: none"></div>
            </div>
          </div>
          <div class="region-map-controls-scroll">
            <div class="region-map-overlays">
              <div class="region-map-overlays-title">Permanent bereik tonen</div>
              <div class="region-map-overlays-radios">
                <label>
                  <input type="radio" name="overlay" value="" checked /> Uit
                </label>
                <label>
                  <input type="radio" name="overlay" value="provinces" />
                  Provincies
                </label>
              </div>
            </div>
            <div class="region-map-places-check">
              <label>
                <input type="checkbox" id="show-places" checked /> Plaatsen
                tonen
              </label>
            </div>
            <div class="region-map-hierarchy">
              <h4>Regioncodes</h4>
              <div class="hierarchy-tree" id="hierarchy"></div>
            </div>
          </div>
        </div>
      </div>
      <button
        type="button"
        class="region-map-controls-toggle"
        id="toggle-controls"
        title="Paneel in-/uitklappen"
      ></button>
      <div id="region-map-container"></div>
    </div>

    <div class="region-map-header-bar">
      <div class="region-map-header-main">
        <h1>
          Kaart van regioncodes
          <span class="region-map-badge" title="Pagina in opbouw"
            >In opbouw</span
          >
        </h1>
      </div>
      <nav class="region-map-header-nav" aria-label="Site">
        <a href="/region-configurator">Configurator</a>
        <a href="/">Map</a>
        <a href="/stats">Stats</a>
      </nav>
    </div>

    <script src="./lib/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script>
      (function () {
        const PROVINCE_NAMES = {
          "be-van": "Antwerpen",
          "be-vbr": "Vlaams-Brabant",
          "be-vov": "Oost-Vlaanderen",
          "be-vwv": "West-Vlaanderen",
          "be-vli": "Limburg",
          "be-bru": "Brussel",
          "be-wbr": "Waals-Brabant",
          "be-wht": "Henegouwen",
          "be-wlg": "Luik",
          "be-wna": "Namen",
          "be-wlx": "Luxemburg",
        };
        const PROVINCE_CODES = [
          "be-van",
          "be-vbr",
          "be-vov",
          "be-vwv",
          "be-vli",
          "be-bru",
          "be-wbr",
          "be-wht",
          "be-wlg",
          "be-wna",
          "be-wlx",
        ];
        let locations = [];
        let map = null;
        let markerCluster = null;
        let provincesLayer = null;
        let overlayMode = "";
        let showPlaces = true;
        let currentSearch = "";
        let lastMatches = [];
        let autocompleteIndex = -1;
        const belgiumCenter = [50.5, 4.35];
        const belgiumZoom = 8;

        function normalize(s) {
          return (s || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");
        }

        function getLocationsWithCoords() {
          return locations.filter(function (loc) {
            return loc.lat && loc.lon;
          });
        }

        function pointsToFeatureCollection(points) {
          return {
            type: "FeatureCollection",
            features: points.map(function (p) {
              return {
                type: "Feature",
                geometry: { type: "Point", coordinates: [p.lon, p.lat] },
                properties: {},
              };
            }),
          };
        }

        function buildHullFromPoints(points, maxEdgeKm) {
          if (!points.length || typeof turf === "undefined") return null;
          if (points.length < 3) return null;
          var fc = pointsToFeatureCollection(points);
          var hull = null;
          try {
            if (turf.concave) {
              hull = turf.concave(fc, {
                maxEdge: maxEdgeKm || 50,
                units: "kilometers",
              });
            }
          } catch (e) {}
          if (!hull && turf.convex) {
            try {
              hull = turf.convex(fc);
            } catch (e2) {}
          }
          return hull;
        }

        function buildProvinceAreas() {
          var layers = {};
          var withCoords = getLocationsWithCoords();
          PROVINCE_CODES.forEach(function (code) {
            var pts = withCoords.filter(function (l) {
              return l.province_code === code;
            });
            var hull = buildHullFromPoints(pts, 50);
            if (hull) layers[code] = hull;
          });
          return layers;
        }

        function getOverlayStyle(code) {
          var colors = {
            "be-van": "rgba(0, 120, 80, 0.15)",
            "be-vbr": "rgba(0, 140, 100, 0.15)",
            "be-vov": "rgba(0, 100, 120, 0.15)",
            "be-vwv": "rgba(0, 110, 90, 0.15)",
            "be-vli": "rgba(0, 130, 85, 0.15)",
            "be-wbr": "rgba(180, 90, 0, 0.15)",
            "be-wht": "rgba(200, 70, 0, 0.15)",
            "be-wlg": "rgba(160, 60, 20, 0.15)",
            "be-wna": "rgba(190, 80, 30, 0.15)",
            "be-wlx": "rgba(170, 100, 40, 0.15)",
            "be-bru": "rgba(0, 100, 200, 0.2)",
          };
          return {
            fillColor: colors[code] || "rgba(100,100,100,0.15)",
            fillOpacity: 0.6,
            color: "rgba(0,0,0,0.4)",
            weight: 1,
          };
        }

        function updateOverlays() {
          if (markerCluster) {
            map.removeLayer(markerCluster);
            markerCluster = null;
          }
          if (provincesLayer) {
            map.removeLayer(provincesLayer);
            provincesLayer = null;
          }
          if (
            overlayMode === "provinces" &&
            typeof turf !== "undefined"
          ) {
            var areas = buildProvinceAreas();
            var features = [];
            for (var code in areas) {
              if (areas[code]) {
                var feat = areas[code];
                var geom = feat.geometry || feat;
                var props = feat.properties
                  ? Object.assign({}, feat.properties, { code: code })
                  : { code: code };
                var f =
                  turf && turf.feature
                    ? turf.feature(geom, props)
                    : { type: "Feature", geometry: geom, properties: props };
                features.push(f);
              }
            }
            if (features.length) {
              provincesLayer = L.geoJSON(
                { type: "FeatureCollection", features: features },
                {
                  style: function (f) {
                    return getOverlayStyle(f.properties.code);
                  },
                  onEachFeature: function (f, layer) {
                    layer.bindTooltip(
                      PROVINCE_NAMES[f.properties.code] || f.properties.code,
                      { permanent: false },
                    );
                  },
                },
              );
              map.addLayer(provincesLayer);
            }
          }
          if (showPlaces && lastMatches.length) {
            var group = L.featureGroup();
            lastMatches.forEach(function (loc) {
              var circle = L.circleMarker([loc.lat, loc.lon], {
                radius: 6,
                fillColor: "#2563eb",
                color: "#1d4ed8",
                weight: 1,
                fillOpacity: 0.9,
              });
              circle.bindPopup(
                "<strong>" +
                  (loc.plaats || "") +
                  "</strong><br><code>" +
                  (loc.city_code || "") +
                  "</code> · " +
                  (PROVINCE_NAMES[loc.province_code] || loc.province_code),
              );
              group.addLayer(circle);
            });
            map.addLayer(group);
            markerCluster = group;
          }
        }

        function matchLocations(query) {
          if (!query || !query.trim()) return getLocationsWithCoords();
          var q = normalize(query.trim());
          return locations.filter(function (loc) {
            if (!loc.lat || !loc.lon) return false;
            if (loc.city_code === q || normalize(loc.city_code).includes(q))
              return true;
            if (
              loc.province_code === q ||
              normalize(loc.province_code).includes(q)
            )
              return true;
            if (q === "be") return true;
            if (
              normalize(loc.plaats).includes(q) ||
              normalize(loc.gemeente).includes(q)
            )
              return true;
            return false;
          });
        }

        function buildAutocompleteItems(query) {
          if (!query || query.length < 2) return [];
          var q = normalize(query);
          var items = [];
          var seen = new Set();
          PROVINCE_CODES.forEach(function (c) {
            if (
              normalize(c).includes(q) ||
              normalize(PROVINCE_NAMES[c] || "").includes(q)
            ) {
              if (!seen.has(c)) {
                seen.add(c);
                items.push({
                  type: "province",
                  code: c,
                  label: (PROVINCE_NAMES[c] || c) + " (" + c + ")",
                });
              }
            }
          });
          locations.forEach(function (loc) {
            if (items.length >= 15) return;
            if (!loc.lat || !loc.lon) return;
            if (
              normalize(loc.city_code).includes(q) ||
              normalize(loc.plaats).includes(q) ||
              normalize(loc.gemeente).includes(q)
            ) {
              var key = loc.city_code;
              if (!seen.has(key)) {
                seen.add(key);
                items.push({
                  type: "place",
                  code: loc.city_code,
                  label: (loc.plaats || "") + " (" + loc.city_code + ")",
                });
              }
            }
          });
          return items.slice(0, 12);
        }

        function showAutocomplete(items) {
          var ac = document.getElementById("autocomplete");
          ac.innerHTML = "";
          ac.style.display = "none";
          if (!items.length) return;
          items.forEach(function (item, i) {
            var el = document.createElement("div");
            el.className =
              "autocomplete-item" + (i === autocompleteIndex ? " active" : "");
            el.textContent = item.label;
            el.dataset.index = i;
            el.dataset.code = item.code;
            el.dataset.type = item.type || "place";
            el.addEventListener("click", function () {
              runCodeSearch(item.code, item.type);
              ac.innerHTML = "";
              ac.style.display = "none";
            });
            ac.appendChild(el);
          });
          ac.style.display = "block";
          autocompleteIndex = 0;
          ac.querySelector(".autocomplete-item")?.classList.add("active");
        }

        function runCodeSearch(code, type) {
          var input = document.getElementById("code-input");
          if (input) input.value = code;
          currentSearch = code;
          var matched = matchLocations(code);
          lastMatches = matched;
          updateMap(matched);
          updateCounter(matched.length);
        }

        function updateCounter(count) {
          var txt = document.getElementById("counter-text");
          var sp = document.getElementById("spinner");
          if (sp) sp.style.display = "none";
          if (count === undefined) {
            txt.textContent = currentSearch
              ? lastMatches.length + " plaats(en)"
              : "Typ een regioncode of plaatsnaam";
          } else {
            txt.textContent = count + " plaats(en) getoond";
          }
        }

        function updateMap(matched) {
          if (!map) return;
          if (markerCluster) {
            map.removeLayer(markerCluster);
            markerCluster = null;
          }
          if (!showPlaces || !matched.length) {
            updateCounter(matched ? matched.length : 0);
            if (matched && matched.length === 1) {
              map.setView([matched[0].lat, matched[0].lon], 12);
            } else if (matched && matched.length > 1 && matched.length < 30) {
              var b = L.latLngBounds(
                matched.map(function (l) {
                  return [l.lat, l.lon];
                }),
              );
              map.fitBounds(b, { padding: [30, 30] });
            }
            return;
          }
          var group = L.featureGroup();
          matched.forEach(function (loc) {
            var circle = L.circleMarker([loc.lat, loc.lon], {
              radius: 6,
              fillColor: "#2563eb",
              color: "#1d4ed8",
              weight: 1,
              fillOpacity: 0.9,
            });
            circle.bindPopup(
              "<strong>" +
                (loc.plaats || "") +
                "</strong><br><code>" +
                (loc.city_code || "") +
                "</code> · " +
                (PROVINCE_NAMES[loc.province_code] || loc.province_code),
            );
            group.addLayer(circle);
          });
          map.addLayer(group);
          markerCluster = group;
          updateCounter(matched.length);
          if (matched.length === 1) {
            map.setView([matched[0].lat, matched[0].lon], 12);
          } else if (matched.length < 30) {
            var bounds = L.latLngBounds(
              matched.map(function (l) {
                return [l.lat, l.lon];
              }),
            );
            map.fitBounds(bounds, { padding: [30, 30] });
          }
        }

        function buildHierarchy() {
          var withCoords = getLocationsWithCoords();
          var html =
            '<div class="hierarchy-node indent-0" data-code="be" data-type="country">België (be)</div>';
          PROVINCE_CODES.forEach(function (p) {
            var locs = withCoords.filter(function (l) {
              return l.province_code === p;
            });
            if (!locs.length) return;
            html +=
              '<div class="hierarchy-node indent-1" data-code="' +
              p +
              '" data-type="province">' +
              (PROVINCE_NAMES[p] || p) +
              " (" +
              p +
              ") · " +
              locs.length +
              " plaatsen</div>";
          });
          var el = document.getElementById("hierarchy");
          if (el) {
            el.innerHTML = html;
            el.querySelectorAll(".hierarchy-node").forEach(function (n) {
              n.addEventListener("click", function () {
                runCodeSearch(n.dataset.code, n.dataset.type);
              });
            });
          }
        }

        function init() {
          map = L.map("region-map-container").setView(
            belgiumCenter,
            belgiumZoom,
          );
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          }).addTo(map);

          document
            .getElementById("toggle-controls")
            .addEventListener("click", function () {
              document.getElementById("controls").classList.toggle("collapsed");
              window.setTimeout(function () {
                if (map) map.invalidateSize({ animate: false });
              }, 280);
            });

          window.addEventListener("resize", function () {
            if (map) map.invalidateSize({ animate: false });
          });
          var rmVV = window.visualViewport;
          if (rmVV) {
            rmVV.addEventListener("resize", function () {
              if (map) map.invalidateSize({ animate: false });
            });
          }
          window.addEventListener("orientationchange", function () {
            window.setTimeout(function () {
              if (map) map.invalidateSize({ animate: false });
            }, 400);
          });

          document
            .querySelectorAll('input[name="overlay"]')
            .forEach(function (r) {
              r.addEventListener("change", function () {
                overlayMode = this.value;
                updateOverlays();
              });
            });

          document
            .getElementById("show-places")
            .addEventListener("change", function () {
              showPlaces = this.checked;
              updateMap(
                lastMatches.length
                  ? lastMatches
                  : matchLocations(currentSearch),
              );
            });

          var input = document.getElementById("code-input");
          input.addEventListener("input", function () {
            var items = buildAutocompleteItems(this.value);
            showAutocomplete(items);
            if (!items.length && this.value.trim()) {
              var m = matchLocations(this.value);
              lastMatches = m;
              currentSearch = this.value;
              updateMap(m);
              updateCounter(m.length);
            }
          });

          input.addEventListener("keydown", function (e) {
            var ac = document.getElementById("autocomplete");
            var items = ac.querySelectorAll(".autocomplete-item");
            if (e.key === "ArrowDown") {
              e.preventDefault();
              autocompleteIndex = Math.min(
                autocompleteIndex + 1,
                items.length - 1,
              );
              items.forEach(function (el, i) {
                el.classList.toggle("active", i === autocompleteIndex);
              });
            } else if (e.key === "ArrowUp") {
              e.preventDefault();
              autocompleteIndex = Math.max(autocompleteIndex - 1, 0);
              items.forEach(function (el, i) {
                el.classList.toggle("active", i === autocompleteIndex);
              });
            } else if (e.key === "Enter" && items[autocompleteIndex]) {
              e.preventDefault();
              var it = items[autocompleteIndex];
              runCodeSearch(it.dataset.code, it.dataset.type || "place");
              ac.innerHTML = "";
              ac.style.display = "none";
            } else if (e.key === "Escape") {
              ac.innerHTML = "";
              ac.style.display = "none";
            }
          });

          input.addEventListener("focus", function () {
            var items = buildAutocompleteItems(this.value);
            if (items.length) showAutocomplete(items);
          });

          document.addEventListener("click", function (e) {
            if (!e.target.closest(".region-map-search-wrap")) {
              document.getElementById("autocomplete").innerHTML = "";
              document.getElementById("autocomplete").style.display = "none";
            }
          });

          fetch("./data/be-locode.json")
            .then(function (r) {
              return r.ok ? r.json() : [];
            })
            .then(function (data) {
              locations = data || [];
              lastMatches = [];
              buildHierarchy();
              document.getElementById("counter-text").textContent =
                locations.length + " locaties geladen";
            })
            .catch(function () {
              locations = [];
              document.getElementById("counter-text").textContent =
                "Kon locaties niet laden.";
            });
        }

        init();
      })();
    </script>
  </body>
</html>
